[package]
name = "compliance-oracle"
version = "0.1.0"
edition = "2021"
build = "build.rs"
autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
odra = { version = "2.8.0", default-features = false }

[build-dependencies]
odra-build = { version = "2.8.0", default-features = false }

[dev-dependencies]
odra-test = { version = "2.8.0", default-features = false }

[[bin]]
name = "compliance_oracle_build_contract"
path = "examples/compliance_oracle_build_contract.rs"
test = false

